name: Source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check server.js
      - name: Check required static files
        shell: bash
        run: |
          test -s index.html
          test -s market.html
          test -s styles.css
